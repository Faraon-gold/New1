<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление группами</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0}
    .wrap{max-width:1100px;margin:30px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
    .btn{display:inline-block;background:#1f6feb;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;border:0;cursor:pointer}
    .btn.secondary{background:#2ea043}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin-top:14px}
    .subject-grid{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin-top:10px}
    .card{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:16px;background:#fafcff}
    .title{margin:0 0 6px 0}
    .muted{color:#667085;font-size:14px}
    .item{padding:10px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;background:#fff}
    input,select{padding:10px;border:1px solid #d0d7de;border-radius:8px;background:#fff}
    .list{margin-top:12px;max-height:360px;overflow:auto}
  </style>
</head>
<body>
<div class="wrap">
  <a class="btn" href="/app">← На главную</a>
  <h1 class="title">Управление группами</h1>
  <p class="muted">Здесь администратор управляет связями «группа ↔ предмет ↔ преподаватель».</p>

  <div class="card">
    <h3 class="title">Создать предмет</h3>
    <p class="muted">Новый предмет можно сразу привязать к преподавателю, либо оставить без преподавателя.</p>
    <div class="subject-grid">
      <input id="newSubjectName" placeholder="Название предмета">
      <select id="newSubjectTeacher"></select>
      <button class="btn secondary" onclick="createSubject()">Создать предмет</button>
    </div>
  </div>

  <div class="card">
    <h3 class="title">Привязка предмета к группе</h3>
    <div class="grid">
      <select id="group"></select>
      <select id="subject"></select>
      <select id="teacher"></select>
      <button class="btn" onclick="bind()">Привязать</button>
    </div>
  </div>

  <div class="card">
    <h3 class="title">Текущие привязки</h3>
    <div id="list" class="list"></div>
  </div>
</div>

<script>
const token=localStorage.getItem('access_token');
const headers=()=>({'Content-Type':'application/json','Authorization':`Bearer ${token}`});

async function load(){
 if(!token){location.href='/login';return;}
 const [g,s,u,m]=await Promise.all([
   fetch('/groups',{headers:headers()}),
   fetch('/subjects',{headers:headers()}),
   fetch('/users?role_filter=teacher&limit=1000',{headers:headers()}),
   fetch('/group-subjects',{headers:headers()})
 ]);
 if([g,s,u,m].some(r=>!r.ok)){document.getElementById('list').innerHTML='<div class="item">Ошибка загрузки данных</div>';return;}
 const groups=await g.json(), subjects=await s.json(), teachers=await u.json(), mappings=await m.json();

 const teacherOptions='<option value="">Без преподавателя</option>'+teachers.map(x=>`<option value="${x.id}">${x.full_name}</option>`).join('');
 document.getElementById('teacher').innerHTML=teacherOptions;
 document.getElementById('newSubjectTeacher').innerHTML=teacherOptions;

 document.getElementById('group').innerHTML=groups.filter(x=>x.name!=='0').map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
 document.getElementById('subject').innerHTML=subjects.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');

 document.getElementById('list').innerHTML=mappings.length
   ? mappings.map(x=>`<div class="item"><strong>${x.group_name}</strong> — ${x.subject_name}<br><span class="muted">Преподаватель: ${x.teacher_name||'-'}</span></div>`).join('')
   : '<div class="item">Пока нет привязок</div>';
}

async function createSubject(){
 const name=document.getElementById('newSubjectName').value.trim();
 const teacher_id=document.getElementById('newSubjectTeacher').value;
 if(!name){alert('Введите название предмета');return;}
 const payload={name, teacher_id: teacher_id?parseInt(teacher_id):null};
 const r=await fetch('/subjects',{method:'POST',headers:headers(),body:JSON.stringify(payload)});
 const d=await r.json();
 if(!r.ok){alert(d.detail||'Ошибка создания предмета');return;}
 document.getElementById('newSubjectName').value='';
 await load();
}

async function bind(){
 const payload={
   group_id:parseInt(document.getElementById('group').value),
   subject_id:parseInt(document.getElementById('subject').value),
   teacher_id:document.getElementById('teacher').value?parseInt(document.getElementById('teacher').value):null
 };
 const r=await fetch('/group-subjects',{method:'POST',headers:headers(),body:JSON.stringify(payload)});
 const d=await r.json();
 if(!r.ok){alert(d.detail||'Ошибка привязки');return;}
 await load();
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
