<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Система учёта посещаемости</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; }
        .container { max-width: 980px; margin: 30px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-weight: 700; color: #1f6feb; }
        .role { color: #555; margin-bottom: 16px; }
        .buttons-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .btn { background: #1f6feb; color: #fff; text-decoration: none; border: 0; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; min-height: 48px; }
        .btn.secondary { background: #2ea043; }
        .btn.warning { background: #d97706; }
        .btn.danger { background: #dc2626; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">Система учёта посещаемости</div>
        <button class="btn danger" onclick="logout()">Выход</button>
    </header>

    <h1>Главная страница</h1>
    <p id="welcome-text" class="role">Загрузка профиля...</p>

    <div class="buttons-grid">
        <a href="/schedule-page" class="btn">Расписание</a>
        <a href="/attendance/mark" class="btn">Посещаемость</a>
        <a href="/profile" class="btn secondary">Личный кабинет</a>
        <a id="admin-management-btn" href="/admin/users" class="btn warning hidden">Управление пользователями и группами</a>
    </div>
</div>

<script>
async function loadProfile() {
    const token = localStorage.getItem('access_token');
    if (!token) {
        window.location.href = '/login';
        return;
    }

    const response = await fetch('/api/users/me', {
        headers: { 'Authorization': `Bearer ${token}` }
    });

    if (!response.ok) {
        localStorage.removeItem('access_token');
        window.location.href = '/login';
        return;
    }

    const user = await response.json();
    document.getElementById('welcome-text').textContent = `Добро пожаловать, ${user.full_name}!`;

    if (user.role === 'admin') {
        document.getElementById('admin-management-btn').classList.remove('hidden');
    }
}

function logout() {
    localStorage.removeItem('access_token');
    document.cookie = 'access_token=; Max-Age=0; path=/';
    window.location.href = '/';
}

document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
