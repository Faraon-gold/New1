<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f6fb; margin:0; }
        .wrap { max-width: 1200px; margin: 30px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
        .btn { display:inline-block; background:#F4A900; color:#fff; padding:10px 14px; border-radius:8px; text-decoration:none; }
        .meta { color:#4b5563; margin: 12px 0; }
        .frame-wrap { margin-top: 16px; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
        iframe { width: 100%; min-height: 900px; border: 0; }
        .hint { margin-top: 12px; font-size: 14px; color: #6b7280; }
    </style>
</head>
<body>
<div class="wrap">
    <a class="btn" href="/app">На главную</a>
    <h1>Расписание</h1>
        <div class="frame-wrap">
        <iframe src="{{ embed_url }}" title="Расписание из Google Таблицы"></iframe>
    </div>

    <p class="hint">
        Если встраивание недоступно, откройте <a href="{{ source_url }}" target="_blank" rel="noopener noreferrer">таблицу напрямую</a>.
    </p>
</div>
</body>
</html>
