services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://attendance_user:attendance_pass@db:5432/postgres
      - DB_INIT_MAX_RETRIES=40
      - DB_INIT_RETRY_DELAY=2
    command: >
      sh -c "python backend_init.py && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
